name: Vigilante One Piece (vigilados)

on:
  schedule:
    - cron: "0 */3 * * *"    # cada 3 horas: lo que vigilas, con avisos
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: vigilante-one-piece
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ejecutar vigilante (modo vigilar)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --modo vigilar
      - name: Detectar novedades por tienda (Funcion 2)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --modo novedades
      - name: Guardar estado y datos
        run: |
          git config user.name "vigilante-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar estado/datos (vigilados)"
            git pull --rebase --autostash origin main || true
            git push
          fi
