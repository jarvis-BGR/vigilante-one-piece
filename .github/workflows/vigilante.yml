name: Vigilante One Piece

on:
  schedule:
    - cron: "0 */3 * * *"    # se ejecuta solo cada 3 horas
  workflow_dispatch: {}        # y tambien a mano, con un boton

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el vigilante
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar el estado actualizado
        run: |
          git config user.name "vigilante-bot"
          git config user.email "actions@users.noreply.github.com"
          git add estado.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "Actualizar estado del vigilante"
            git push
          fi
