name: Vigilante One Piece (catalogo diario)

on:
  schedule:
    - cron: "0 6 * * *"     # una vez al dia (~08:00 Madrid): repasa TODO el catalogo, sin avisos
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: vigilante-one-piece
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ejecutar vigilante (modo catalogo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --modo catalogo
      - name: Guardar datos
        run: |
          git config user.name "vigilante-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar datos (catalogo diario)"
            git pull --rebase --autostash origin main || true
            git push
          fi
