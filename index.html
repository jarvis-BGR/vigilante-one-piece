<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock One Piece</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1c1a17;--muted:#6b655c;--line:#e7e3db;
    --accent:#c8102e;--accent2:#e0a021;--ok:#1f9d55;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);}
  @media (prefers-color-scheme:dark){:root{--bg:#15140f;--card:#201e18;--ink:#f2efe8;--muted:#a49d90;
    --line:#332f27;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{padding:20px 20px 6px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.2px}h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:0;font-size:14px}
  .cfg{max-width:1100px;margin:6px auto 0;padding:0 20px;font-size:12px;color:var(--muted)}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
  .bar .wrap{max-width:1100px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search]{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;outline:none}
  input[type=search]:focus{border-color:var(--accent2)}
  select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
  label.chk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
  .count{color:var(--muted);font-size:13px;white-space:nowrap}
  main{max-width:1100px;margin:0 auto;padding:16px 20px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.name{font-size:12px}.set{font-size:10px}
    select{flex:1;min-width:44%}.bar .wrap{gap:8px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s ease;position:relative}
  .card:hover{transform:translateY(-2px)}
  .badge{position:absolute;top:8px;left:8px;color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:2px 8px;z-index:2}
  .thumb{aspect-ratio:1/1;background:#f0ece3 center/contain no-repeat;display:flex;align-items:center;justify-content:center}
  @media (prefers-color-scheme:dark){.thumb{background:#2a271f}}
  .thumb img{width:100%;height:100%;object-fit:contain}
  .ph{color:var(--muted);font-weight:700;font-size:15px;text-align:center;padding:8px}
  .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .set{font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.4px}
  .name{font-size:13px;font-weight:600;line-height:1.3}
  .best{margin-top:auto;font-size:12.5px;font-weight:600;padding-top:6px}
  .best small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .empty{color:var(--muted);text-align:center;padding:40px}
  dialog{border:0;border-radius:16px;max-width:560px;width:94%;padding:0;box-shadow:var(--shadow);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:20px}
  .dlg h2{margin:0 0 2px;font-size:18px}
  .dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .dhead img{width:74px;height:74px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#f0ece3}
  .offer{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .offer .tn{font-weight:600}.offer .pr{margin-left:auto;font-weight:700;white-space:nowrap}
  .offer .lk{margin-left:8px}
  .offer a{color:#fff;background:var(--accent);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}
  .offer.off{opacity:.55}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .btn{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Stock <span>One Piece</span></h1>
  <p class="sub">Inventario en vivo de las tiendas. Lo que está en stock sale primero. Toca un producto para ver todas las tiendas y su enlace.</p>
</header>
<div class="cfg" id="cfg"></div>

<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Busca por edición, nombre o tipo…">
  <select id="fSet"><option value="">Todas las ediciones</option></select>
  <select id="fTipo"><option value="">Todos los tipos</option></select>
  <select id="fIdi"><option value="">Cualquier idioma</option></select>
  <label class="chk"><input type="checkbox" id="soloStock"> Solo en stock</label>
  <span class="count" id="count"></span>
</div></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No hay productos que coincidan.</div>
</main>

<dialog id="dlgP"><div class="dlg">
  <div class="dhead"><img id="dImg" alt=""><div><h2 id="dTitle"></h2><div class="count" id="dMeta"></div></div></div>
  <label class="chk"><input type="checkbox" id="dSolo"> Mostrar solo tiendas en stock</label>
  <div id="offers"></div>
  <div class="row"><span class="count" id="dMedia"></span>
    <button class="btn ghost" id="dClose" style="margin-left:auto">Cerrar</button></div>
</div></dialog>

<script>
const OWNER="jarvis-BGR", REPO="vigilante-one-piece";
const RAW=p=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${p}?t=`+Date.now();
const EST={DISPONIBLE:["#1f9d55","🟢","En stock"],PREVENTA:["#e0a021","🟡","Preventa"],
  AGOTADO:["#c8102e","🔴","Agotado"],"—":["#9a938a","⚪","Sin datos"]};
const $=id=>document.getElementById(id);
const eur=n=>n==null||isNaN(n)?"":Number(n).toFixed(2).replace(".",",")+" €";
const rank=e=>e==="DISPONIBLE"?0:e==="PREVENTA"?1:e==="AGOTADO"?2:3;
const idiLabel=i=>i==="?"||!i?"Sin especificar":i;

function slugify(s){return (s||"").toLowerCase()
  .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
  .replace(/ñ/g,"n").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"tienda";}

function parseSet(nombre){
  const m=(nombre||"").match(/\b(OP|EB|DP|ST|PRB)[-\s]?0*(\d{1,2})\b/i);
  return m?m[1].toUpperCase()+"-"+String(m[2]).padStart(2,"0"):"Otros";
}

let GROUPS=[];
const num=v=>(v!=null&&v!=="")&&!isNaN(v)?parseFloat(v):null;

function addOffer(map,set,tipo,idioma,nombre,img,of){
  if(!tipo) return;
  idioma=idioma||"?";
  const key=set+"|"+tipo+"|"+idioma;
  let g=map.get(key);
  if(!g){g={key,set,tipo,idioma,nombre:nombre||(set+" "+tipo),img:img||"",ofertas:[]};map.set(key,g);}
  if(img&&!g.img)g.img=img;
  const ex=g.ofertas.find(o=>o.tienda===of.tienda);
  if(!ex)g.ofertas.push(of);
  else if(rank(of.estado)<rank(ex.estado)||(rank(of.estado)===rank(ex.estado)&&(of.precio??1e12)<(ex.precio??1e12)))Object.assign(ex,of);
}

function construir(CAT,DATOS,LISTAS){
  const map=new Map();
  // 1) catálogo curado (Comic Stores / Area151) con datos en vivo
  (CAT||[]).forEach(p=>{
    (p.tiendas||[]).forEach(t=>{
      const d=(DATOS.items||{})[p.prod+"|"+t.tienda]||{};
      addOffer(map,p.set||parseSet(p.nombre),p.tipo,p.idioma||"?",p.nombre,p.img,
        {tienda:t.tienda,estado:d.estado||"—",precio:num(d.precio),url:d.url||t.url,fecha:d.fecha||""});
    });
  });
  // 2) inventario en vivo de las tiendas de colección (Función 2)
  LISTAS.forEach(store=>{
    Object.values(store.items||{}).forEach(it=>{
      addOffer(map,parseSet(it.nombre),it.tipo,it.idioma,it.nombre,"",
        {tienda:store.tienda,estado:it.estado||"—",precio:num(it.precio),url:it.url,fecha:it.fecha||""});
    });
  });
  return [...map.values()];
}

function best(g){
  const o=g.ofertas;
  const d=o.filter(x=>x.estado==="DISPONIBLE").sort((a,b)=>(a.precio??1e12)-(b.precio??1e12));if(d.length)return{...d[0],clase:"DISPONIBLE"};
  const p=o.filter(x=>x.estado==="PREVENTA").sort((a,b)=>(a.precio??1e12)-(b.precio??1e12));if(p.length)return{...p[0],clase:"PREVENTA"};
  const a=o.filter(x=>x.estado==="AGOTADO");if(a.length)return{...a[0],clase:"AGOTADO"};
  return null;
}
function media(g){const ps=g.ofertas.map(x=>x.precio).filter(x=>x!=null);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;}

function poblarFiltros(){
  const sets=[...new Set(GROUPS.map(g=>g.set))].sort((a,b)=>a==="Otros"?1:b==="Otros"?-1:a.localeCompare(b,"es",{numeric:true}));
  const tipos=[...new Set(GROUPS.map(g=>g.tipo))].sort();
  const idis=[...new Set(GROUPS.map(g=>g.idioma))].sort();
  $("fSet").length=1;sets.forEach(s=>$("fSet").insertAdjacentHTML("beforeend",`<option>${s}</option>`));
  $("fTipo").length=1;tipos.forEach(t=>$("fTipo").insertAdjacentHTML("beforeend",`<option>${t}</option>`));
  $("fIdi").length=1;idis.forEach(i=>$("fIdi").insertAdjacentHTML("beforeend",`<option value="${i}">${idiLabel(i)}</option>`));
}

let prodActual=null;
function render(){
  const term=$("q").value.trim().toLowerCase(),fs=$("fSet").value,ft=$("fTipo").value,fi=$("fIdi").value,solo=$("soloStock").checked;
  let items=GROUPS.filter(g=>{
    const b=best(g);
    if(solo&&!(b&&b.clase==="DISPONIBLE"))return false;
    return (!term||(g.set+" "+g.nombre+" "+g.tipo).toLowerCase().includes(term))
      &&(!fs||g.set===fs)&&(!ft||g.tipo===ft)&&(!fi||g.idioma===fi);});
  // primero lo que está en stock, luego preventa, agotado, sin datos; y más barato primero
  items.sort((a,b)=>{
    const ba=best(a),bb=best(b);
    const ra=ba?rank(ba.clase):3,rb=bb?rank(bb.clase):3;
    if(ra!==rb)return ra-rb;
    return (ba&&ba.precio!=null?ba.precio:1e12)-(bb&&bb.precio!=null?bb.precio:1e12);
  });
  const g=$("grid");g.innerHTML="";
  items.forEach(gr=>{
    const b=best(gr),md=media(gr);
    let bestHtml;
    if(b){const[c,em,lab]=EST[b.clase];
      bestHtml=`<div class="best"><span class="dot" style="background:${c}"></span>${lab}: ${b.tienda} ${b.precio!=null?"· "+eur(b.precio):""}`
        +(md!=null?`<small>Precio medio: ${eur(md)}</small>`:"")+`</div>`;
    }else bestHtml=`<div class="best" style="color:var(--muted);font-weight:500">Sin datos aún</div>`;
    const b0=b?b.clase:"—";const[bc,,blab]=EST[b0];
    const card=document.createElement("div");card.className="card";
    card.innerHTML=(b0!=="—"?`<div class="badge" style="background:${bc}">${blab}</div>`:"")+`
      <div class="thumb">${gr.img?`<img src="${gr.img}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="ph" style="display:none">${gr.set}</div>`:`<div class="ph">${gr.set}</div>`}</div>
      <div class="body"><div class="set">${gr.set} · ${gr.tipo} · ${idiLabel(gr.idioma)}</div>
        <div class="name">${gr.nombre}</div>${bestHtml}</div>`;
    card.onclick=()=>abrir(gr);
    g.appendChild(card);
  });
  $("empty").hidden=items.length>0;
  const enStock=GROUPS.filter(g=>{const b=best(g);return b&&b.clase==="DISPONIBLE";}).length;
  $("count").textContent=items.length+" de "+GROUPS.length+" · "+enStock+" en stock";
}

function abrir(g){
  prodActual=g;
  $("dImg").src=g.img||"";$("dImg").style.visibility=g.img?"visible":"hidden";
  $("dTitle").textContent=g.nombre;
  $("dMeta").textContent=g.set+" · "+g.tipo+" · "+idiLabel(g.idioma);
  pintar();
  const md=media(g);$("dMedia").textContent=md!=null?("Precio medio: "+eur(md)):"";
  $("dlgP").showModal();
}
function pintar(){
  const g=prodActual,solo=$("dSolo").checked;
  let offs=g.ofertas.slice().sort((a,b)=>rank(a.estado)-rank(b.estado)||((a.precio??1e12)-(b.precio??1e12)));
  if(solo)offs=offs.filter(o=>o.estado==="DISPONIBLE");
  const c=$("offers");
  if(!offs.length){c.innerHTML='<div class="offer" style="border:0;color:var(--muted)">Ninguna tienda en stock ahora mismo.</div>';return;}
  c.innerHTML=offs.map(o=>{const[col,,lab]=EST[o.estado]||EST["—"];
    return `<div class="offer${o.estado==="AGOTADO"||o.estado==="—"?" off":""}">
      <span class="dot" style="background:${col}"></span>
      <span class="tn">${o.tienda}<br><span class="count">${lab}${o.fecha?" · "+o.fecha:""}</span></span>
      <span class="pr">${o.precio!=null?eur(o.precio):"—"}</span>
      <span class="lk"><a href="${o.url}" target="_blank" rel="noopener">Ver ▸</a></span></div>`;}).join("");
}

$("q").oninput=render;$("fSet").onchange=render;$("fTipo").onchange=render;$("fIdi").onchange=render;$("soloStock").onchange=render;
$("dSolo").onchange=pintar;$("dClose").onclick=()=>$("dlgP").close();

(async()=>{
  $("cfg").textContent="Cargando inventario…";
  let CAT=[],DATOS={items:{}},LISTAS=[];
  try{const r=await fetch(RAW("catalogo.json"));if(r.ok)CAT=await r.json();}catch(e){}
  try{const r=await fetch(RAW("datos.json"));if(r.ok)DATOS=await r.json();}catch(e){}
  let tiendas=[];
  try{const r=await fetch(RAW("tiendas_coleccion.json"));if(r.ok)tiendas=await r.json();}catch(e){}
  await Promise.all(tiendas.map(async t=>{
    try{const r=await fetch(RAW("listas/"+slugify(t.tienda)+".json"));if(r.ok)LISTAS.push(await r.json());}catch(e){}
  }));
  GROUPS=construir(CAT,DATOS,LISTAS);
  poblarFiltros();render();
  const upd=DATOS._actualizado?(" · datos del "+DATOS._actualizado):"";
  $("cfg").textContent="Tiendas: "+(tiendas.map(t=>t.tienda).join(", ")||"—")+upd;
})();
</script>
</body>
</html>
